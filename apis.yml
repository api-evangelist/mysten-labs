aid: mysten-labs
name: Mysten Labs
description: >-
  Mysten Labs is the web3 infrastructure company that created Sui, a Layer 1
  blockchain and smart-contract platform built on the Move programming language,
  and Walrus, a decentralized blob-storage network coordinated on Sui. Mysten
  Labs publishes the Sui developer platform: a JSON-RPC (OpenRPC) API, a GraphQL
  RPC API, and a gRPC (Protobuf) API for reading chain state, querying objects
  and events, and executing transactions, together with first-party TypeScript,
  Rust, and Move SDKs, the `sui` command-line interface, dApp Kit, and
  zkLogin/Enoki authentication tooling. The public full-node RPC endpoints are
  open (no API key), and the platform is fully open source under Apache 2.0.

apis:
- name: Sui JSON-RPC API
  description: >-
    The Sui full-node JSON-RPC API (OpenRPC 1.2.6) for reading objects, coins,
    balances, events, checkpoints, dynamic fields, and system state, and for
    dry-running/executing transaction blocks. 56 methods across the sui_, suix_,
    and unsafe_ namespaces. Deprecated in favor of gRPC / GraphQL RPC (migration
    targeted July 2026).
  humanURL: https://docs.sui.io/references/sui-api
  baseURL: https://fullnode.mainnet.sui.io:443
  tags:
  - JSON-RPC
  - OpenRPC
  - Blockchain
  properties:
  - type: OpenRPC
    url: openrpc/mysten-labs-sui-jsonrpc-openrpc.json
  - type: Documentation
    url: https://docs.sui.io/references/sui-api
- name: Sui GraphQL RPC API
  description: >-
    The Sui GraphQL RPC API — a GraphQL interface over Sui network data
    (objects, transactions, events, checkpoints, coins, name service) served
    from indexed full-node data. Recommended replacement for JSON-RPC.
  humanURL: https://docs.sui.io/references/sui-graphql
  baseURL: https://graphql.mainnet.sui.io/graphql
  tags:
  - GraphQL
  - Blockchain
  properties:
  - type: Documentation
    url: https://docs.sui.io/references/sui-graphql
- name: Sui gRPC API
  description: >-
    The Sui full-node gRPC API (Protobuf, sui.rpc.v2) exposing LedgerService,
    StateService, TransactionExecutionService, MovePackageService,
    SignatureVerificationService, and SubscriptionService for high-throughput,
    typed access to chain data and transaction execution. Recommended
    replacement for JSON-RPC.
  humanURL: https://docs.sui.io/references/fullnode-protocol
  baseURL: https://fullnode.mainnet.sui.io:443
  tags:
  - gRPC
  - Protobuf
  - Blockchain
  properties:
  - type: Protobuf
    url: grpc/sui/rpc/v2/ledger_service.proto
  - type: Documentation
    url: https://docs.sui.io/references/fullnode-protocol

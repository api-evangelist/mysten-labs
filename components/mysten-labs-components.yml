  registry: npm
  url: https://www.npmjs.com/package/@mysten/dapp-kit
  install: npm install @mysten/dapp-kit @mysten/sui @tanstack/react-query
  official: true
  docs: https://sdk.mystenlabs.com/dapp-kit
- name: '@mysten/wallet-kit'
  registry: npm
  url: https://www.npmjs.com/package/@mysten/wallet-kit
  official: true
  status: legacy
families:
- family: Providers
  built_on: React context
  components:
  - name: SuiClientProvider
    description: Provides a SuiClient and network configuration to the app.
  - name: WalletProvider
    description: Manages wallet connection state for all descendant components.
  loader: '@mysten/dapp-kit'
- family: Wallet UI
  built_on: Radix UI
  components:

summary: >-
  The Sui dApp Kit is Mysten Labs' first-party set of React UI components, hooks,
  and providers for building Sui dApps — pre-built, drop-in wallet-connection and
  account-management components built on Radix UI, plus lower-level hooks for
  custom UIs. Distinct from the server/client SDKs in packages/: this is the
  browser/embeddable component surface. All installed wallets are auto-detected.
loaders:

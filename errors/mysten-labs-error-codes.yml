error_reasons:
- reason: ERROR_REASON_UNKNOWN
  value: 0
- reason: FIELD_INVALID
  value: 1
  meaning: A request field held an invalid value.
- reason: FIELD_MISSING
  value: 2
  meaning: A required request field was absent.
execution_status:
  source: grpc/sui/rpc/v2/execution_status.proto
  note: >-
    Transaction-level failures are enumerated in ExecutionStatus (e.g. insufficient
    gas, Move abort with an abort code and location, arithmetic error, object
    version/ownership violations, command index). These are execution outcomes
    carried in TransactionEffects, not API errors.
notes: >-
  Derived from the published proto/OpenRPC. Sui does not use RFC 9457

description: >-
  Sui exposes two error surfaces. (1) The gRPC API returns google.rpc.Status
  (code + message + details) with a sui.rpc.v2.ErrorReason enum and
  google.rpc.error_details. (2) The JSON-RPC API returns standard JSON-RPC 2.0
  error objects (code + message + data). Transaction execution failures are
  reported in the ExecutionStatus of a transaction's effects rather than as an
  API transport error.
